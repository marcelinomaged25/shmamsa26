{% extends 'base.html' %}
{% block title %}مستوى قوة المكوّن{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">{% if comp %}تعديل مستوى القوة{% else %}إضافة مستوى قوة{% endif %}</h3>
      <form method="post">
        {% csrf_token %}
        {% if not comp %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">نوع المكوّن</label>
          <select name="type_id" class="form-select" required>
            {% for t in types %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">اسم المكوّن</label>
          <input type="text" name="name" class="form-control" value="{{ comp.name|default:'' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">قيمة القوة</label>
          <input type="number" name="power_value" class="form-control" value="{{ comp.power_value|default:25 }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">السعر بالعملات</label>
          <input type="number" step="0.01" name="price" class="form-control" value="{{ comp.price|default:100.0 }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">الكمية المتاحة</label>
          <input type="number" name="stock" class="form-control" value="{{ comp.stock|default:999 }}" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">حفظ مستوى القوة</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
