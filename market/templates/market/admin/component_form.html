{% extends 'base.html' %}
{% block title %}Component Power Level Form{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">{% if comp %}Edit Power Level{% else %}Create Power Level{% endif %}</h3>
      <form method="post">
        {% csrf_token %}
        {% if not comp %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">Component Type</label>
          <select name="type_id" class="form-select" required>
            {% for t in types %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">Component Name (e.g. Motor-100)</label>
          <input type="text" name="name" class="form-control" value="{{ comp.name|default:'' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">Power Value (e.g. 25, 50, 100)</label>
          <input type="number" name="power_value" class="form-control" value="{{ comp.power_value|default:25 }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">Price in Coins</label>
          <input type="number" step="0.01" name="price" class="form-control" value="{{ comp.price|default:100.0 }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">Stock Quantity</label>
          <input type="number" name="stock" class="form-control" value="{{ comp.stock|default:999 }}" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Save Power Level Component</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
