{% extends 'base.html' %}
{% block title %}إضافة اختبار{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">إضافة اختبار مباشر</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">عنوان الاختبار</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">الوصف</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">المدة بالثواني</label>
          <input type="number" name="duration_seconds" class="form-control" value="300" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">إضافة الاختبار</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
