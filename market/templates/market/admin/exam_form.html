{% extends 'base.html' %}
{% block title %}Create Exam{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">Create New Live Exam</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">Exam Title</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">Description</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">Duration in Seconds (e.g. 300)</label>
          <input type="number" name="duration_seconds" class="form-control" value="300" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Create Exam</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
