{% extends 'base.html' %}
{% block title %}بيانات الفريق{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">{% if team %}تعديل الفريق{% else %}إضافة فريق{% endif %}</h3>
      <form method="post">
        {% csrf_token %}
        {% if not team %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">كلمة المرور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label font-weight-bold">اسم الفريق</label>
          <input type="text" name="team_name" class="form-control" value="{{ team.teamName|default:'' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">الأعضاء (بينهم فاصلة)</label>
          <input type="text" name="members" class="form-control" value="{{ team.members_list|default:'' }}">
        </div>
        <div class="mb-3">
          <label class="form-label font-weight-bold">رصيد العملات</label>
          <input type="number" step="0.01" name="coins" class="form-control" value="{{ team.balance|default:1000.0 }}" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">حفظ الفريق</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
