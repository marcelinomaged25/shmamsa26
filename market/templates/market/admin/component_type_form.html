{% extends 'base.html' %}
{% block title %}إضافة نوع مكوّن{% endblock title %}
{% block body %}
<section class="py-4">
  <div class="container">
    <div class="card shadow p-4 border-0 rounded-4 col-lg-6 mx-auto">
      <h3 class="fw-bold mb-4">إضافة نوع مكوّن جديد</h3>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-bold">الاسم</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Engine, Chassis" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">الوصف (اختياري)</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">إضافة النوع</button>
      </form>
    </div>
  </div>
</section>
{% endblock body %}
